[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laminar"
version = "0.1.0"
description = "Laminar async RL: versioned rollout, relay, and ExperienceBuffer on top of verl"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hydra-core",
    "omegaconf",
    "orjson",
    "psutil",
    "verl>=0.10.0.dev0,<0.11",
    "tensordict>=0.10.0",
    "uni-agent==0.1.0.dev0",
]

[project.optional-dependencies]
swe = ["swebench==4.1.0"]
ucx = ["ucxx-cu13==0.51.1"]
vllm = [
    "verl[vllm]",
    # synced from pinned verl (begin)
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",
    "vllm==0.32.0",
    "transformers==5.16.1",
    "TransferQueue>=0.1.11",
    "pyzmq",
    "msgspec",
