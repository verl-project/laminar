dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Repository = "https://github.com/verl-project/laminar"
Issues = "https://github.com/verl-project/laminar/issues"
Paper = "https://doi.org/10.1145/3767295.3803580"

[project.scripts]
laminar = "laminar.train.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"laminar.train" = ["config/*.yaml", "config/optimizer_defaults/*.yaml"]
"laminar.eval" = ["config/*.yaml"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "G"]
ignore = ["F405", "F403", "E731", "B007", "UP032", "G004", "UP045", "UP035"]

# Public source pins also select the backend configuration synchronized below.
# Package versions alone cannot distinguish unreleased API changes.
[tool.uv]
# Backend settings below are synchronized from the public verl source pin.
environments = [
    "python_full_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "python_full_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'aarch64'",
]
conflicts = []
override-dependencies = [
    "tilelang==0.1.15",
    "transformers==5.16.1",
    "tokenizers==0.23.2",
    "numpy>=2.0.0",
    "kernels>=0.14.1,<0.15",
    "flash-attn-4 ; platform_machine == 'flash-attn-4-excluded'",
    "nvidia-cusparselt-cu13==0.8.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.9.1 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
]
constraint-dependencies = [
    "numpy<2.5",
]

[[tool.uv.dependency-metadata]]
name = "megatron-core"
version = "0.19.2"
requires-dist = ["torch>=2.6.0", "numpy", "packaging>=24.2"]

[[tool.uv.dependency-metadata]]
name = "megatron-bridge"
version = "0.6.2"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "TransferQueue"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "deep-ep"
version = "1.2.1"
requires-dist = []

[tool.uv.sources.deep-ep]
index = "verl-wheelhouse"

[tool.uv.sources.apex]
index = "verl-wheelhouse"

[tool.uv.sources.flash-attn]
index = "verl-wheelhouse"

[tool.uv.sources.transformer-engine]
index = "verl-wheelhouse"

[tool.uv.sources.megatron-bridge]
index = "verl-wheelhouse"

[tool.uv.sources.megatron-core]
git = "https://github.com/NVIDIA/Megatron-LM.git"
tag = "core_v0.19.2"

[tool.uv.sources.torch]
index = "pytorch-cu130"

[tool.uv.sources.torchvision]
index = "pytorch-cu130"

[tool.uv.sources.torchaudio]
index = "pytorch-cu130"

[tool.uv.sources.verl]
# TODO: switch back to https://github.com/verl-project/verl.git once upstream PRs are merged.
git = "https://github.com/tongyx361/verl-laminar-hooks.git"
rev = "4a8cf3c6fa99960caf22c582ce6412124995565a"

[tool.uv.sources.uni-agent]
# TODO: switch back to https://github.com/verl-project/uni-agent.git once upstream PRs are merged.
git = "https://github.com/tongyx361/uni-agent.git"
rev = "9f4935f4286e0263d1f974c1efefd1c6128c4e7a"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "verl-wheelhouse"
url = "https://verl-project.github.io/verl-wheelhouse/cu130/torch2.13/simple/"
explicit = true
